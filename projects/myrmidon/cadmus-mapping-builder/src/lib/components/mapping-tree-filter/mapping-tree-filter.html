<!-- no <form>: this widget is embedded in the mapping tree -->
<div class="filter" [style.margin.px]="wrapped() ? 16 : 0">
  <div class="form-row">
    <!-- name -->
    <mat-form-field>
      <mat-label>name</mat-label>
      <input
        matInput
        [formField]="form.name"
        (keydown.enter)="$event.preventDefault(); apply()"
      />
    </mat-form-field>

    <!-- buttons -->
    <button
      type="button"
      mat-icon-button
      matTooltip="Reset"
      aria-label="reset filter"
      (click)="reset()"
    >
      <mat-icon class="mat-warn">clear</mat-icon>
    </button>
    <button
      type="button"
      (click)="apply()"
      mat-icon-button
      matTooltip="Apply"
      aria-label="apply filter"
      [disabled]="form().invalid()"
    >
      <mat-icon class="mat-primary">check_circle</mat-icon>
    </button>
  </div>
</div>

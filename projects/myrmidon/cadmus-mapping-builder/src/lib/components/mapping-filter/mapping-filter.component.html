<!-- no <form>: filters are applied explicitly -->
<div role="form" aria-label="filter">
  <!-- sourceType -->
  <div>
    <mat-form-field>
      <mat-label>source type</mat-label>
      <mat-select [formField]="form.sourceType">
        <mat-option [value]="0">any</mat-option>
        <mat-option [value]="1">item</mat-option>
        <mat-option [value]="2">part</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- name -->
  <div>
    <mat-form-field>
      <mat-label>name</mat-label>
      <input
        matInput
        [formField]="form.name"
        autocomplete="off"
        (keydown.enter)="onEnter($event)"
      />
    </mat-form-field>
  </div>

  <!-- facet -->
  <div>
    <mat-form-field>
      <mat-label>facet</mat-label>
      <input
        matInput
        [formField]="form.facet"
        autocomplete="off"
        (keydown.enter)="onEnter($event)"
      />
    </mat-form-field>
  </div>

  <!-- group -->
  <div>
    <mat-form-field>
      <mat-label>group</mat-label>
      <input
        matInput
        [formField]="form.group"
        autocomplete="off"
        (keydown.enter)="onEnter($event)"
      />
    </mat-form-field>
  </div>

  <!-- flags -->
  <div>
    <mat-form-field>
      <mat-label>flags</mat-label>
      <input
        matInput
        type="number"
        [formField]="form.flags"
        (keydown.enter)="onEnter($event)"
        autocomplete="off"
      />
    </mat-form-field>
  </div>

  <!-- title -->
  <div>
    <mat-form-field>
      <mat-label>title</mat-label>
      <input
        matInput
        [formField]="form.title"
        autocomplete="off"
        (keydown.enter)="onEnter($event)"
      />
    </mat-form-field>
  </div>

  <!-- partType -->
  <div>
    <mat-form-field>
      <mat-label>part type</mat-label>
      <input
        matInput
        [formField]="form.partType"
        autocomplete="off"
        (keydown.enter)="onEnter($event)"
      />
    </mat-form-field>
  </div>

  <!-- partRole -->
  <div>
    <mat-form-field>
      <mat-label>part role</mat-label>
      <input
        matInput
        [formField]="form.partRole"
        autocomplete="off"
        (keydown.enter)="onEnter($event)"
      />
    </mat-form-field>
  </div>

  <div>
    <div>
      <button
        type="button"
        mat-icon-button
        (click)="reset()"
        matTooltip="Reset all the filters"
        aria-label="reset filters"
      >
        <mat-icon class="mat-warn">clear</mat-icon>
      </button>
      <button
        type="button"
        (click)="apply()"
        mat-icon-button
        [disabled]="!canApply()"
        matTooltip="Apply filters"
        aria-label="apply filters"
      >
        <mat-icon class="mat-primary">check_circle</mat-icon>
      </button>
    </div>
  </div>
</div>

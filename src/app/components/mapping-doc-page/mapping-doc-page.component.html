<mat-card>
  <mat-card-header>
    <mat-card-title>Mappings Document</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div>
      <div id="editor">
        <ngx-monaco-editor
          [formField]="form.json"
          [language]="'json'"
          [options]="editorOptions"
          (editorInitialized)="onEditorInit($event)"
        />
      </div>

      @if (
        form.json().getError("required") &&
        (form.json().touched() || form.json().dirty())
      ) {
        <mat-error>please enter some text</mat-error>
      }
    </div>
    <div class="form-row">
      <button
        type="button"
        mat-flat-button
        class="mat-primary"
        (click)="exportToDocument()"
      >
        <mat-icon>file_download</mat-icon>
        export in doc
      </button>
      <button
        type="button"
        mat-flat-button
        class="mat-warn"
        [disabled]="form().invalid()"
        (click)="importFromDocument()"
      >
        <mat-icon>file_upload</mat-icon>
        import from doc
      </button>
    </div>
  </mat-card-content>
</mat-card>
